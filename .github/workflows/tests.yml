# Lance les tests JUnit du serveur à chaque push et à chaque pull request
name: Tests

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: instagram
    steps:
      - uses: actions/checkout@v4

      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          cache-dependency-path: instagram/pom.xml

      - name: Lancer les tests
        run: mvn -B test
